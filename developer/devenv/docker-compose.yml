name: dtaas-devenv

services:
  devenv:
    build: &devenv-build
      context: ../../
      dockerfile: developer/devenv/Dockerfile
      args:
        UID: ${UID:?run developer/devenv/init.sh first}
        GID: ${GID:?run developer/devenv/init.sh first}
    image: dtaas/devenv:latest
    init: true
    command: sleep infinity
    volumes: &devenv-volumes
      - ../../:/workspace/DTaaS
      - client-node-modules:/workspace/DTaaS/client/node_modules
      - libms-node-modules:/workspace/DTaaS/servers/lib/node_modules
      - logger-node-modules:/workspace/DTaaS/servers/logger/node_modules
      - dt-automation-node-modules:/workspace/DTaaS/lib/dt-automation/node_modules
      - home-cache:/home/dtaas/.cache
    ports:
      - "${CLIENT_PORT:-4000}:4000"
      - "${LIBMS_PORT:-4001}:4001"
      - "${LOGGER_PORT:-4003}:4003"
    networks:
      - dtaas_shared

  docs:
    build: *devenv-build
    image: dtaas/devenv:latest
    init: true
    command: mkdocs serve --config-file mkdocs.yml --dev-addr 0.0.0.0:8000
    volumes: *devenv-volumes
    ports:
      - "${DOCS_PORT:-8000}:8000"
    networks:
      - dtaas_shared

volumes:
  client-node-modules:
  libms-node-modules:
  logger-node-modules:
  dt-automation-node-modules:
  home-cache:

networks:
  dtaas_shared:
    external: true
